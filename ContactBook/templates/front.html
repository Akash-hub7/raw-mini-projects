<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Contact Book</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='styling.css') }}">
</head>

<body>

    <header>
        <h1>📒 My Contact Book</h1>
        <p>Manage your contacts easily</p>
    </header>

    <main class="container">

        <!-- Top Section -->
        <div class="top-section">
            <h2>My Contacts</h2>

            <button onclick="showForm()">
                + Add Contact
            </button>
        </div>

        <!-- Search Bar -->
        <input
            type="text"
            id="searchInput"
            placeholder="Search contacts..."
            onkeyup="searchContacts()"
        >

        <!-- Add Contact Form -->
        <div id="contactForm" style="display: none;">

            <h3>Add New Contact</h3>

            <form action="/add" method="POST">

                <input
                    type="text"
                    name="name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="tel"
                    name="phone"
                    placeholder="Phone Number"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                >

                <button type="submit">
                    Save Contact
                </button>

                <button type="button" onclick="hideForm()">
                    Cancel
                </button>

            </form>

        </div>

        <!-- Contact List -->
        <div class="contact-list" id="contactList">

            {% for contact in contacts %}

            <div class="contact-card">

                <div class="profile">
                    {{ contact[1][0] | upper }}
                </div>

                <div class="contact-details">

                    <h3>{{ contact[1] }}</h3>

                    <p>{{ contact[2] }}</p>

                    <small>{{ contact[3] }}</small>

                </div>

                <div class="actions">

                    <a href="tel:{{ contact[2] }}">📞</a>

                    <form action="/delete/{{ contact[0] }}" method="POST">
                     <button type="submit" onclick="return confirm('Delete this contact?')">
                        🗑️
                     </button>
                    </form>

                </div>

            </div>

            {% endfor %}

        </div>

    </main>

    <footer>
        <p>My Contact Book © 2026</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
